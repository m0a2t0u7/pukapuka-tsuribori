<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ぷかぷか！つりぼり</title>
<style>
  :root{--foam:#eaf5f0;--ink:#0d2422;--paper:#f3efe6;--gold:#e0b34d;--ui:#f1ede2;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0a1f1d;}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    display:flex;justify-content:center;align-items:center;touch-action:none;
    user-select:none;-webkit-user-select:none;}
  #wrap{position:relative;width:100%;height:100%;max-width:520px;max-height:100vh;
    background:#0a1f1d;overflow:hidden;}
  canvas#c{display:block;width:100%;height:100%;touch-action:none;}
  .hud{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;
    justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;}
  .pill{background:rgba(10,32,30,.42);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 12px;color:var(--ui);}
  .pill .k{font-size:10px;letter-spacing:.14em;opacity:.7;}
  .pill .v{font-size:20px;font-weight:700;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums;}
  .top-right{display:flex;gap:8px;}
  .icon-btn{pointer-events:auto;background:rgba(10,32,30,.42);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14);border-radius:14px;width:44px;height:44px;
    color:var(--ui);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn:active{transform:scale(.94);}
  .prompt{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:18px 20px 26px;
    text-align:center;pointer-events:none;}
  .prompt .msg{color:var(--ui);font-size:15px;letter-spacing:.02em;
    text-shadow:0 1px 8px rgba(0,0,0,.5);min-height:22px;transition:opacity .3s;}
  .prompt .hint{color:rgba(241,237,226,.6);font-size:12px;margin-top:6px;
    text-shadow:0 1px 6px rgba(0,0,0,.5);}
  #tension{position:absolute;left:22px;bottom:120px;width:14px;height:180px;z-index:5;display:none;}
  .tbar{position:absolute;inset:0;border-radius:8px;overflow:hidden;
    background:rgba(10,32,30,.5);border:1px solid rgba(255,255,255,.16);}
  .tfill{position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(#57c99a,#8fd6b0);transition:height .1s linear;}
  #tension .lbl{position:absolute;left:20px;bottom:0;color:var(--ui);font-size:10px;
    letter-spacing:.1em;writing-mode:vertical-rl;opacity:.75;}
  .overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;
    justify-content:center;padding:24px;background:rgba(6,22,20,.55);backdrop-filter:blur(3px);}
  .overlay.show{display:flex;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{width:100%;max-width:320px;background:var(--paper);border-radius:22px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.2,1.2,.3,1);}
  @keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .card .cvbox{background:linear-gradient(160deg,#3d8175,#1c4f47);position:relative;height:200px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card .cvbox img{max-width:82%;max-height:78%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));}
  .card .rare{position:absolute;top:12px;right:14px;font-size:11px;letter-spacing:.14em;
    padding:5px 10px;border-radius:20px;font-weight:700;color:#3a2a05;background:var(--gold);}
  .card .newbadge{position:absolute;top:12px;left:14px;font-size:12px;letter-spacing:.06em;
    padding:5px 12px;border-radius:20px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#ff8a5b,#ff5252);
    box-shadow:0 4px 12px rgba(255,82,82,.45);
    animation:newpop .5s cubic-bezier(.2,1.4,.4,1);}
  @keyframes newpop{from{transform:scale(0) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
  .card .body{padding:18px 20px 22px;}
  .card .name{font-size:23px;font-weight:800;color:var(--ink);}
  .card .sub{font-size:12px;color:#6a7a72;margin-top:2px;letter-spacing:.04em;}
  .card .stats{display:flex;gap:10px;margin-top:14px;}
  .card .stat{flex:1;background:#eae4d6;border-radius:12px;padding:9px 10px;text-align:center;}
  .card .stat .k{font-size:9px;letter-spacing:.12em;color:#8a978f;}
  .card .stat .v{font-size:17px;font-weight:800;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums;}
  .card .flavor{font-size:12.5px;color:#5c6a63;line-height:1.6;margin-top:14px;}
  .btn{display:block;width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;
    background:var(--ink);color:var(--foam);font-size:15px;font-weight:700;letter-spacing:.06em;
    cursor:pointer;font-family:inherit;}
  .btn:disabled{opacity:.65;cursor:wait;}
  .btn:active{transform:scale(.98);}
  .sheet{width:100%;max-width:420px;max-height:82vh;background:var(--paper);border-radius:22px;
    overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:pop .35s ease;}
  .sheet .head{padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid #e2dccd;}
  .sheet .head h2{font-size:19px;color:var(--ink);letter-spacing:.04em;}
  .sheet .head .x{width:34px;height:34px;border-radius:50%;background:#e6e0d1;border:none;
    font-size:18px;color:#5c6a63;cursor:pointer;}
  .sheet .grid{padding:14px 16px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dex{background:#ece6d8;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;}
  .dex.locked{opacity:.5;}
  .dex .chip{width:58px;height:44px;border-radius:10px;flex:0 0 auto;position:relative;overflow:hidden;
    background:linear-gradient(160deg,#4d8a7d,#255a51);display:flex;align-items:center;justify-content:center;}
  .dex .chip img{max-width:92%;max-height:88%;}
  .dex .chip .q{color:#cfe3d9;font-size:20px;font-weight:800;}
  .dex .meta .n{font-size:13.5px;font-weight:800;color:var(--ink);}
  .dex .meta .c{font-size:9.5px;color:#8a978f;margin-top:1px;letter-spacing:.08em;}
  .dex .meta .best{font-size:10.5px;color:#6a7a72;margin-top:2px;}
  .sheet .foot{padding:12px 20px 18px;border-top:1px solid #e2dccd;font-size:12px;color:#6a7a72;text-align:center;}
  .start{width:100%;max-width:340px;text-align:center;color:var(--ui);}
  .start .logo{font-size:34px;font-weight:800;letter-spacing:.06em;text-shadow:0 2px 20px rgba(0,0,0,.5);}
  .start .logo small{display:block;font-size:12px;font-weight:500;letter-spacing:.4em;opacity:.7;margin-top:8px;}
  .start p{font-size:13px;line-height:1.8;margin:20px auto 4px;opacity:.85;max-width:280px;}
  .fade-out{animation:fadeout .4s forwards;}
  @keyframes fadeout{to{opacity:0;visibility:hidden}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;}
.zones{position:absolute;top:83px;left:14px;right:14px;display:flex;gap:6px;z-index:6;justify-content:center;}
.zone{flex:1;padding:9px 3px;border-radius:20px;border:1px solid #ffffff45;background:#143d47a8;color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.zone.active{background:#f3efe6;color:#163840;box-shadow:0 3px 12px #0002;}.zone:disabled{opacity:.45;cursor:default;}
.dex .meta{min-width:0}.dex .meta .n{font-size:12px;overflow-wrap:anywhere}.dex{gap:6px}.sheet .grid{touch-action:pan-y;overscroll-behavior:contain;}

.card .cvbox .catch-art{position:relative;z-index:1;animation:fish-arrive .8s cubic-bezier(.2,.8,.3,1) both;}
.card .rare,.card .newbadge{z-index:3;}
.rare-catch .cvbox{background:radial-gradient(ellipse at 50% 45%,#73876a 0%,#345e59 45%,#193f43 100%);}
.new-catch .cvbox{background:radial-gradient(ellipse at 50% 45%,#659e91,#265a55 70%);}
.rare-catch .cvbox::before{content:'';position:absolute;inset:-90%;background:conic-gradient(from 0deg,transparent 0deg 20deg,#efd37f23 20deg 30deg,transparent 30deg 50deg,#efd37f23 50deg 60deg,transparent 60deg 80deg,#efd37f23 80deg 90deg,transparent 90deg 110deg,#efd37f23 110deg 120deg,transparent 120deg 140deg,#efd37f23 140deg 150deg,transparent 150deg 170deg,#efd37f23 170deg 180deg,transparent 180deg 200deg,#efd37f23 200deg 210deg,transparent 210deg 230deg,#efd37f23 230deg 240deg,transparent 240deg 260deg,#efd37f23 260deg 270deg,transparent 270deg 290deg,#efd37f23 290deg 300deg,transparent 300deg 320deg,#efd37f23 320deg 330deg,transparent 330deg 350deg,#efd37f23 350deg 360deg);animation:soft-rays 2s ease-out both;pointer-events:none;}
.confetti-layer{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;}
.confetti-layer i{position:absolute;left:var(--x);top:-12px;width:6px;height:11px;border-radius:2px;background:var(--piece);animation:confetti-fall 2s var(--delay) ease-in forwards;opacity:0;}
@keyframes confetti-fall{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:.95}80%{opacity:.8}100%{opacity:0;transform:translateY(240px) rotate(var(--turn))}}
@keyframes fish-arrive{0%{transform:translateY(16px) scale(.84);opacity:0}65%{transform:translateY(-4px) scale(1.03);opacity:1}100%{transform:none;opacity:1}}
@keyframes soft-rays{from{transform:rotate(-12deg);opacity:0}40%{opacity:1}to{transform:rotate(12deg);opacity:.65}}
@media(prefers-reduced-motion:reduce){.card,.overlay.show,.catch-art,.newbadge,.rare-catch .cvbox::before{animation:none!important}.confetti-layer{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="flash" id="flash"></div>
  <div class="hud">
    <div class="pill"><div class="k">スコア</div><div class="v" id="score">0</div></div>
    <div class="top-right">
      <div class="pill" style="text-align:right"><div class="k">つれた</div><div class="v" id="caught">0</div></div>
      <div class="icon-btn" id="dexBtn">&#128214;</div>
    </div>
  </div>
  <div class="zones" id="zones" aria-label="釣り場"></div>
  <div id="tension"><div class="tbar"><div class="tfill" id="tfill"></div></div><div class="lbl">たぐりよせ</div></div>
  <div class="prompt">
    <div class="msg" id="msg">水面をタップして、糸を投げよう</div>
    <div class="hint" id="hint">&mdash; しずかに、待つのも釣り &mdash;</div>
  </div>
  <div class="overlay show" id="startOv">
    <div class="start" id="startInner">
      <div class="logo">ぷかぷか！つりぼり<small>F I S H I N G&nbsp;&nbsp;P O N D</small></div>
      <p>川・池、海、熱帯、大物の4つの釣り場。<br>90種類の仲間を集めよう！<br>ウキが動いたらタップ、あとは画面を<b>押したまま</b>で引き上げるだけ！</p>
      <button class="btn" id="startBtn">はじめる</button>
    </div>
  </div>
  <div class="overlay" id="catchOv"></div>
  <div class="overlay" id="dexOv"></div>
</div>
<script>
"use strict";
const SPECIES=[
  {id:'ayu',name:'アユ',rarity:0,w:22,flavor:'川の若鮎。スイカのような香りがするとか、しないとか。'},

  {id:'koi',name:'コイ',rarity:1,w:45,flavor:'ゆったりと、堂々と。見つけると少しうれしい。'},
  {id:'sake',name:'サケ／マス',rarity:1,w:50,flavor:'虹色に光る側線。渓流の人気者、パワフルな引き。'},
  {id:'shirauo',name:'シラウオ',rarity:1,w:8,flavor:'透きとおる小さな体。すくうように、そっと。'},
  {id:'tanago',name:'タナゴ',rarity:1,w:8,flavor:'手のひらサイズの美しい魚。貝に卵を産む変わり者。'},
  {id:'chouzame',name:'チョウザメ',rarity:2,w:80,flavor:'古代から姿を変えない生きた化石。硬い背びれが特徴。'},
  {id:'demekin',name:'デメキン',rarity:2,w:15,flavor:'まんまるの目。どこかで飼われていた子かも。'},
  {id:'dojou',name:'ドジョウ',rarity:0,w:15,flavor:'泥の底が大好き。ひげでモゾモゾ、のんびり屋。'},
  {id:'namazu',name:'ナマズ',rarity:1,w:40,flavor:'ひげが自慢。にごった底のほうが好きらしい。'},
  {id:'nigoi',name:'ニゴイ',rarity:1,w:30,flavor:'コイに似た細身の体。意外と俊敏に泳ぐ。'},
  {id:'nishikigoi',name:'ニシキゴイ',rarity:2,w:40,flavor:'紅白の模様がうつくしい。池のスター。'},
  {id:'nushi',name:'ぬし',rarity:3,w:70,flavor:'金色にきらきら輝く、やさしい池のぬし。会えてうれしいね！'},
  {id:'higai',name:'ヒガイ',rarity:0,w:15,flavor:'銀色の小魚。明治の天皇が好んだという逸話も。'},
  {id:'funa',name:'フナ',rarity:0,w:22,flavor:'池のぬし、というほどでもないけれど、いつもそこにいる。'},
  {id:'herabuna',name:'ヘラブナ',rarity:2,w:35,flavor:'釣り人あこがれの一匹。平たく大きな体が見事。'},
  {id:'honmoroko',name:'ホンモロコ',rarity:0,w:10,flavor:'琵琶湖の名物。金色の線がすっと一本。'},
  {id:'musashi',name:'ムサシトミヨ',rarity:2,w:6,flavor:'今やとても貴重な小魚。会えたのは幸運かも。'},
  {id:'medaka',name:'メダカ',rarity:0,w:3,flavor:'ちいさな体で、水面のちかくをすいすい。'},
  {id:'yamame',name:'ヤマメ',rarity:1,w:25,flavor:'渓流の女王。パーマークと朱点がうつくしい。'},
  {id:'yoshinobori',name:'ヨシノボリ',rarity:0,w:8,flavor:'石にぴたりと張りつく。大きな胸びれで踏ん張る。'},
  {id:'raigyo',name:'ライギョ',rarity:2,w:50,flavor:'水面の狩人。細長い体で、静かに獲物を狙う。'},
  {id:'wakasagi',name:'ワカサギ',rarity:0,w:12,flavor:'冬の湖の風物詩。細く銀色に光る、上品な魚。'}
];
const SPR_SRC={};
const EXTRA_SPECIES=[
['aji','アジ',0,25,'sea','silver'],['iwashi','イワシ',0,18,'sea','slim'],['saba','サバ',0,35,'sea','stripe'],['sanma','サンマ',1,30,'sea','slim'],
['tai','マダイ',1,40,'sea','pink'],['kurodai','クロダイ',1,40,'sea','deep'],['suzuki','スズキ',1,65,'sea','silver'],['buri','ブリ',2,80,'sea','yellow'],
['katsuo','カツオ',1,55,'sea','stripe'],['maguro','マグロ',2,130,'sea','tuna'],['hirame','ヒラメ',1,50,'sea','flat'],['karei','カレイ',0,30,'sea','flat'],
['fugu','フグ',1,25,'sea','puffer'],['kawahagi','カワハギ',1,25,'sea','deep'],['mebaru','メバル',0,22,'sea','deep'],['kasago','カサゴ',1,25,'sea','spiny'],
['kinmedai','キンメダイ',2,40,'sea','red'],['tachiuo','タチウオ',2,90,'sea','eel'],['tobiuo','トビウオ',1,30,'sea','flying'],['shishamo','シシャモ',0,15,'sea','slim'],
['clownfish','カクレクマノミ',0,10,'reef','clown'],['blue_tang','ナンヨウハギ',1,25,'reef','tang'],['butterfly','チョウチョウウオ',0,15,'reef','butterfly'],['angelfish','タテジマキンチャクダイ',2,35,'reef','angel'],
['parrotfish','ブダイ',1,40,'reef','parrot'],['napoleon','ナポレオンフィッシュ',3,150,'reef','hump'],['lionfish','ミノカサゴ',2,30,'reef','lion'],['moorish','ツノダシ',1,20,'reef','banner'],
['goby','ハタタテハゼ',0,8,'reef','dart'],['wrasse','ベラ',0,20,'reef','parrot'],['neon','ネオンテトラ',0,4,'reef','neon'],['guppy','グッピー',0,5,'reef','fan'],
['discus','ディスカス',1,15,'reef','discus'],['betta','ベタ',1,7,'reef','fan'],['arowana','アロワナ',2,70,'giant','gold'],['pirarucu','ピラルク',3,200,'giant','giant'],
['hammerhead','シュモクザメ',2,200,'giant','hammer'],['whaleshark','ジンベエザメ',3,500,'giant','whale'],['manta','マンタ',2,250,'giant','manta'],['oarfish','リュウグウノツカイ',3,300,'giant','oarfish']
];
const ZONES={pond:{name:'川・池',color:'#3f8073'},sea:{name:'海',color:'#287da1'},reef:{name:'熱帯',color:'#269aab'},giant:{name:'大物',color:'#344d83'}};
let currentZone='pond';
SPECIES.forEach(f=>{f.zone='pond';});
EXTRA_SPECIES.forEach(([id,name,rarity,w,zone,art])=>SPECIES.push({id,name,rarity,w,zone,art,flavor:({sea:'海の仲間を発見！ 色やひれの形をよく見てみよう。',reef:'カラフルな熱帯の仲間。図鑑に新しい色が増えた！',giant:'迫力いっぱいの大物！ 次はもっと大きな一匹に出会えるかな？'})[zone]}));

const RARITY_WEIGHT=[46,30,19,5];
function pickSpecies(){
  let total=RARITY_WEIGHT.reduce((a,b)=>a+b,0),r=Math.random()*total,tier=0;
  for(let t=0;t<4;t++){if(r<RARITY_WEIGHT[t]){tier=t;break;}r-=RARITY_WEIGHT[t];}
  let pool=SPECIES.filter(s=>s.zone===currentZone&&s.rarity===tier);
  if(!pool.length)pool=SPECIES.filter(s=>s.zone===currentZone);
  const weights=pool.map(s=>G.dex[s.id]?1:2.5),sum=weights.reduce((a,b)=>a+b,0);
  let roll=Math.random()*sum;return pool.find((s,i)=>(roll-=weights[i])<0)||pool[pool.length-1];
}

function spawnAmbient(){G.fishes=[];for(let i=0;i<7;i++)G.fishes.push(newShadow());}
function newShadow(){const wt=H*G.horizon;
  return {x:Math.random()*W,y:wt+40+Math.random()*(H-wt-90),
    sp:(0.2+Math.random()*0.5)*(Math.random()<.5?-1:1),
    size:14+Math.random()*22,depth:0.4+Math.random()*0.6,wob:Math.random()*6.28,interest:0};}

function addRipple(x,y,max=60,life=1){G.ripples.push({x,y,r:6,max,a:0.5,life});}
function addSplash(x,y,n=14,col='#dff2ec',pw=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(1+Math.random()*4)*pw;
  G.particles.push({x,y,vx:Math.cos(a)*s,vy:-Math.abs(Math.sin(a)*s)-1*pw,g:0.18,life:1,col,r:1.6+Math.random()*1.8});}}
function addSparkle(x,y,n=10){for(let i=0;i<n;i++){G.sparkles.push({x:x+(Math.random()-.5)*80,y:y+(Math.random()-.5)*80,life:1,d:Math.random()*6.28,sz:2+Math.random()*3});}}
function shake(m){G.shake=Math.max(G.shake,m);}

function pointer(e){const r=cv.getBoundingClientRect();const p=(e.touches&&e.touches[0])||e;return {x:p.clientX-r.left,y:p.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);onDown(pointer(e));});
cv.addEventListener('pointerup',e=>{e.preventDefault();onUp();});
cv.addEventListener('pointercancel',()=>onUp());
function onDown(p){const wt=H*G.horizon;
  if(G.state==='idle'){if(p.y<wt-10)return;cast(p.x,p.y);}
  else if(G.state==='waiting'){/* ignore */}
  else if(G.state==='bite'){hook();}
  else if(G.state==='fight'){G.reeling=true;}}
function onUp(){if(G.state==='fight')G.reeling=false;}

function setMsg(m,h){document.getElementById('msg').textContent=m||'';document.getElementById('hint').textContent=h||'';}
function updateHud(){document.getElementById('score').textContent=G.score;document.getElementById('caught').textContent=G.caught;}
function flash(a){const f=document.getElementById('flash');f.style.transition='none';f.style.opacity=a||'0.85';
  requestAnimationFrame(()=>{f.style.transition='opacity .5s';f.style.opacity='0';});}

function cast(x,y){const wt=H*G.horizon;y=Math.max(y,wt+30);y=Math.min(y,H-70);
  G.state='casting';document.querySelectorAll('.zone').forEach(b=>b.disabled=true);G.castProg=0;G.castFrom={x:W*0.62,y:H+20};G.castTo={x,y};
  G.fx=x;G.floatTargetY=y;setMsg('しずかに…','ウキを見て、待とう');}
function beginWait(){G.state='waiting';G.fy=G.floatTargetY;addRipple(G.fx,G.fy,70,1.2);
  addSplash(G.fx,G.fy,10,'#cfe9df');G.waitTimer=2.0+Math.random()*4.0;
  G.fishes.forEach(f=>f.interest=0);
  const near=G.fishes.slice().sort((a,b)=>dist(a,{x:G.fx,y:G.fy})-dist(b,{x:G.fx,y:G.fy}))[0];
  if(near)near.interest=0.4+Math.random()*0.5;
  setMsg('あたりを待とう','ウキが動いたらタップ！');}
function triggerBite(){G.state='bite';G.hooked=pickSpecies();
  G.biteWindow=(2.6-G.hooked.rarity*0.2);G.biteTimer=G.biteWindow;G.submerge=0;
  addRipple(G.fx,G.fy,46,0.9);addSplash(G.fx,G.fy,8,'#cfe9df');shake(4);
  navigator.vibrate&&navigator.vibrate(30);setMsg('…きた！','いま、タップ！');}
function hook(){G.hookQuality=0.85;G.state='fight';G.reeling=false;G.progress=0;G.reveal=0;G.struggle=0.9;
  G.hookedIsNew=!G.dex[G.hooked.id];
  document.getElementById('tension').style.display='block';
  addSplash(G.fx,G.fy,26,'#eaf6f0',1.4);addRipple(G.fx,G.fy,90,1.1);shake(11);flash('0.4');
  navigator.vibrate&&navigator.vibrate([20,50,20]);
  setMsg('かかった！','画面を押したままにして、引き上げよう');}
function missHook(a,b){G.state='resting';G.hooked=null;addSplash(G.fx,G.fy,16,'#cfe9df');
  addRipple(G.fx,G.fy,80,1);setMsg(a,b||'すぐにまた、あたりが来るよ');
  navigator.vibrate&&navigator.vibrate(40);setTimeout(()=>{if(G.state==='resting')beginWait();},700);}

function landFish(){G.state='leap';G.leapT=0;
  const big=G.hooked.zone==='giant'||G.hooked.w>=100;G.leapDur=big?1.5:1.15;
  setMsg(big?'わあ！ おおもの！':G.hookedIsNew?'はじめての仲間だ！':'やった！ つれた！','');
  document.getElementById('tension').style.display='none';
  addSplash(G.fx,H*G.horizon+30,big?48:30,'#f2fbf7',big?2:1.6);addRipple(G.fx,H*G.horizon+34,big?170:120,1.2);
  if(big){addRipple(G.fx,H*G.horizon+34,130,.8);addRipple(G.fx,H*G.horizon+34,90,1.5);}
  shake(9);flash('0.5');navigator.vibrate&&navigator.vibrate([30,30,60]);
  if(G.hooked.rarity>=2||G.hookedIsNew)addSparkle(W/2,H*0.42,big?32:22);}
function finishLand(){const s=G.hooked;const isNew=G.hookedIsNew;
  const size=Math.round(s.w+G.hookQuality*s.w*0.5+Math.random()*s.w*0.4);
  const pts=Math.round((s.rarity*30+20)*(0.8+Math.random()*0.4));
  G.score+=pts;G.caught++;
  const d=G.dex[s.id]||{count:0,best:0};d.count++;d.best=Math.max(d.best,size);G.dex[s.id]=d;
  updateHud();saveProgress();showCatch(s,size,pts,isNew);G.state='caught';document.querySelectorAll('.zone').forEach(b=>b.disabled=false);}

let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;G.t+=dt;update(dt);render();requestAnimationFrame(loop);}
function update(dt){const wt=H*G.horizon;
  // shake decay
  G.shake*=Math.pow(0.001,dt);if(G.shake<0.2)G.shake=0;
  G.shakeX=(Math.random()-0.5)*G.shake;G.shakeY=(Math.random()-0.5)*G.shake;
  // ambient
  G.fishes.forEach(f=>{f.wob+=dt*2;
    if(f.interest>0&&(G.state==='waiting'||G.state==='bite')){
      const dx=G.fx-f.x,dy=(G.fy-8)-f.y,d=Math.hypot(dx,dy)||1;
      f.x+=dx/d*20*dt*f.interest;f.y+=dy/d*14*dt*f.interest;
    }else{f.x+=f.sp*30*dt;f.y+=Math.sin(f.wob)*4*dt;}
    if(f.x<-60)f.x=W+50;if(f.x>W+60)f.x=-50;
    f.y=Math.max(wt+30,Math.min(H-70,f.y));});
  // ripples
  for(let i=G.ripples.length-1;i>=0;i--){const r=G.ripples[i];
    r.r+=(r.max-r.r)*dt*2.2*r.life;r.a-=dt*0.5*r.life;if(r.a<=0)G.ripples.splice(i,1);}
  // particles
  for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.6;if(p.life<=0)G.particles.splice(i,1);}
  // sparkles
  for(let i=G.sparkles.length-1;i>=0;i--){const s=G.sparkles[i];s.life-=dt*0.9;if(s.life<=0)G.sparkles.splice(i,1);}
  // states
  if(G.state==='casting'){G.castProg=Math.min(1,G.castProg+dt*2.4);const e=easeOut(G.castProg);
    G.fx=lerp(G.castFrom.x,G.castTo.x,e);G.fy=lerp(G.castFrom.y,G.castTo.y,e)-Math.sin(e*Math.PI)*90;
    if(G.castProg>=1)beginWait();}
  else if(G.state==='waiting'){G.floatBob=Math.sin(G.t*2.2)*2.2;G.waitTimer-=dt;if(G.waitTimer<=0)triggerBite();}
  else if(G.state==='bite'){G.biteTimer-=dt;const prog=1-(G.biteTimer/G.biteWindow);
    G.submerge=Math.sin(prog*Math.PI);G.floatBob=Math.sin(G.t*20)*1.5;
    if(Math.random()<0.06)addRipple(G.fx,G.fy+6,26,1);
    if(G.biteTimer<=0)missHook('おしい！','またすぐ来るよ、まってて');}
  else if(G.state==='fight'){
    if(G.reeling)G.progress+=dt*34;
    G.progress=Math.max(0,Math.min(100,G.progress));
    G.reveal=lerp(G.reveal,G.progress/100,dt*4);
    G.rodShake=G.reeling?0.6+Math.sin(G.t*16)*0.2:0.15;
    // struggle: periodic thrash
    G.struggle-=dt;
    if(G.struggle<=0){G.struggle=0.5+Math.random()*0.6;
      const jx=G.fx+(Math.random()-.5)*30;addSplash(jx,G.fy,8,'#dbeee7',0.9);
      addRipple(G.fx,G.fy+4,40,1);shake(5);navigator.vibrate&&navigator.vibrate(15);}
    G.fy=lerp(G.floatTargetY,wt+30,G.progress/100)+Math.sin(G.t*18)*2*(G.reeling?1:0.3);
    document.getElementById('tfill').style.height=G.progress+'%';
    if(G.progress>=100)landFish();}
  else if(G.state==='leap'){G.leapT+=dt;G.rodShake=0.2;
    if(G.leapT>=G.leapDur)finishLand();}
}

function render(){
  ctx.save();
  ctx.translate(G.shakeX,G.shakeY);
  const wt=H*G.horizon;
  drawSky(wt);drawFarBank(wt);drawWater(wt);drawShadows(wt);
  drawHookedUnderwater(wt);drawRipples();drawLineAndFloat(wt);
  drawLeap(wt);drawParticles();drawSparkles();drawRod();
  ctx.restore();
}
function drawSky(wt){const g=ctx.createLinearGradient(0,0,0,wt);
  g.addColorStop(0,'#cfe3d6');g.addColorStop(0.6,'#a9cbc0');g.addColorStop(1,'#8fb8ad');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,wt+20);
  const sx=W*0.72,sy=wt*0.42;const sg=ctx.createRadialGradient(sx,sy,4,sx,sy,wt*0.9);
  sg.addColorStop(0,'rgba(255,250,230,.7)');sg.addColorStop(1,'rgba(255,250,230,0)');
  ctx.fillStyle=sg;ctx.fillRect(-20,-20,W+40,wt+20);}
function drawFarBank(wt){ctx.save();ctx.fillStyle='#5f7d5c';ctx.beginPath();ctx.moveTo(-20,wt);
  for(let x=-20;x<=W+20;x+=18){const h=8+Math.sin(x*0.05)*4+Math.sin(x*0.11)*3;ctx.lineTo(x,wt-h);}
  ctx.lineTo(W+20,wt);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#4c6b48';ctx.lineWidth=2;
  for(let i=-20;i<W+20;i+=26){const bx=i+Math.sin(i)*3,bh=14+Math.sin(i*0.7)*8,sway=Math.sin(G.t*0.8+i)*2;
    ctx.beginPath();ctx.moveTo(bx,wt);ctx.quadraticCurveTo(bx+sway,wt-bh*0.6,bx+sway*1.6,wt-bh);ctx.stroke();}
  ctx.restore();}
function drawWater(wt){const g=ctx.createLinearGradient(0,wt,0,H);
  g.addColorStop(0,ZONES[currentZone].color);g.addColorStop(0.5,currentZone==='pond'?'#2b6357':currentZone==='reef'?'#247d94':'#255372');g.addColorStop(1,currentZone==='pond'?'#123a37':'#142d4b');
  ctx.fillStyle=g;ctx.fillRect(-20,wt,W+40,H-wt+20);
  ctx.save();ctx.globalCompositeOperation='screen';const rx=W*0.72;
  for(let i=0;i<9;i++){const yy=wt+8+i*10+Math.sin(G.t*2+i)*2,wobble=Math.sin(G.t*1.6+i*0.9)*18,w=90-i*7;
    ctx.fillStyle='rgba(255,248,220,'+(0.10-i*0.009)+')';ctx.beginPath();ctx.ellipse(rx+wobble,yy,w,2.2,0,0,6.28);ctx.fill();}
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation='screen';ctx.strokeStyle='rgba(210,240,232,0.05)';ctx.lineWidth=1;
  for(let r=0;r<10;r++){const y=wt+20+r*((H-wt-20)/10);ctx.beginPath();
    for(let x=0;x<=W;x+=10){const yy=y+Math.sin(x*0.03+G.t*1.4+r)*3*(1-r/14);x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);}
    ctx.stroke();}ctx.restore();}
function drawShadows(wt){G.fishes.forEach(f=>{const depthA=0.10+f.depth*0.24;ctx.save();
  ctx.translate(f.x,f.y);ctx.scale(f.sp<0?-1:1,1);ctx.fillStyle='rgba(6,26,24,'+depthA+')';
  ctx.beginPath();ctx.ellipse(0,0,f.size,f.size*0.34,0,0,6.28);ctx.fill();
  const tw=Math.sin(f.wob*2)*0.4;ctx.beginPath();ctx.moveTo(-f.size*0.9,0);
  ctx.lineTo(-f.size*1.4,-f.size*0.28+tw*6);ctx.lineTo(-f.size*1.4,f.size*0.28+tw*6);
  ctx.closePath();ctx.fill();ctx.restore();});}
/* hooked fish rising into view during fight */
function drawHookedUnderwater(wt){
  if(G.state!=='fight'||!G.hooked)return;
  const rv=G.reveal;const y=lerp(G.fy+70,G.fy+6,rv);
  ctx.save();
  // silhouette that becomes the real sprite as it rises
  const sp=SPR[G.hooked.id];
  const tw=110*(0.5+rv*0.7);
  const wob=Math.sin(G.t*16)*8*(1-rv*0.4);
  ctx.translate(G.fx+wob,y);
  ctx.globalAlpha=0.35+rv*0.6;
  if(sp&&sp.width&&sp.height){const h=tw*sp.height/sp.width;
    ctx.save();ctx.scale(-1,1);
    // dark underwater tint over sprite via drawing sprite then overlay
    ctx.drawImage(sp,-tw/2,-h/2,tw,h);ctx.restore();
    // greenish water veil
    ctx.globalAlpha=(1-rv)*0.5;ctx.fillStyle='#1c4f47';
    ctx.beginPath();ctx.ellipse(0,0,tw*0.55,tw*0.28,0,0,6.28);ctx.fill();
  }else{ctx.fillStyle='rgba(8,30,28,0.5)';ctx.beginPath();ctx.ellipse(0,0,tw*0.5,tw*0.2,0,0,6.28);ctx.fill();}
  ctx.restore();}
function drawRipples(){ctx.save();G.ripples.forEach(r=>{ctx.strokeStyle='rgba(230,246,240,'+Math.max(0,r.a)+')';
  ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*0.34,0,0,6.28);ctx.stroke();});ctx.restore();}
function drawLineAndFloat(wt){
  if(G.state==='idle'||G.state==='leap')return;
  const bob=(G.state==='waiting'||G.state==='bite')?G.floatBob:0;
  const submergeY=G.state==='bite'?G.submerge*26:0;
  const fx=G.fx,fy=G.fy+bob+submergeY;
  const shk=G.rodShake*(Math.random()-0.5)*6;
  const tipX=W*0.80+shk,tipY=H*0.30;
  ctx.save();ctx.strokeStyle='rgba(240,245,240,0.55)';ctx.lineWidth=1;ctx.beginPath();
  ctx.moveTo(tipX,tipY);const midX=(tipX+fx)/2,midY=Math.min(tipY,fy)-10+(G.state==='fight'?0:14);
  ctx.quadraticCurveTo(midX,midY,fx,fy);ctx.stroke();ctx.restore();
  if(G.state==='casting')return;
  ctx.save();ctx.fillStyle='rgba(8,30,28,0.22)';ctx.beginPath();ctx.ellipse(fx,fy+10,10,3,0,0,6.28);ctx.fill();ctx.restore();
  const sink=G.state==='bite'?G.submerge:0;
  ctx.save();ctx.translate(fx,fy);
  ctx.fillStyle='#d84a3a';ctx.beginPath();ctx.moveTo(-5,-14+sink*8);
  ctx.quadraticCurveTo(-7,-2,-5,2);ctx.lineTo(5,2);ctx.quadraticCurveTo(7,-2,5,-14+sink*8);
  ctx.quadraticCurveTo(0,-18+sink*8,-5,-14+sink*8);ctx.fill();
  ctx.fillStyle='#f2efe6';ctx.beginPath();ctx.ellipse(0,3,6,5,0,0,6.28);ctx.fill();
  ctx.strokeStyle='#c23b2c';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,-14+sink*8);ctx.lineTo(0,-22+sink*8);ctx.stroke();
  ctx.restore();
  if(G.state==='bite'){ctx.save();ctx.strokeStyle='rgba(255,255,255,'+(0.4+G.submerge*0.4)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(fx,fy+6,14+G.submerge*10,5,0,0,6.28);ctx.stroke();
    // "!" pop
    if(G.submerge>0.3){ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
      ctx.globalAlpha=Math.min(1,G.submerge*1.4);ctx.fillText('!',fx,fy-34);}
    ctx.restore();}
}
/* fish leaping out of water on catch */
function drawLeap(wt){
  if(G.state!=='leap'||!G.hooked)return;
  const p=G.leapT/G.leapDur;
  const sp=SPR[G.hooked.id];
  // parabola from float pos up to center then settle
  const startX=G.fx,startY=wt+30,endX=W/2,endY=H*0.40;
  const x=lerp(startX,endX,easeOut(Math.min(1,p*1.4)));
  const arc=Math.sin(Math.min(1,p)*Math.PI)*H*0.20;
  const y=lerp(startY,endY,easeOut(p))-arc;
  const rot=Math.sin(p*Math.PI)*0.6 - 0.3;
  const big=G.hooked.zone==='giant'||G.hooked.w>=100;
  const tw=Math.min(lerp(120,big?245:190,easeOut(p)),W*.72,sp?H*.3*sp.width/sp.height:245);
  drawCatchAura(x,y,tw,p,G.hooked.rarity>=2||big,G.hookedIsNew);
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  if(sp&&sp.width&&sp.height){const h=tw*sp.height/sp.width;ctx.scale(-1,1);
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;
    ctx.drawImage(sp,-tw/2,-h/2,tw,h);}
  ctx.restore();
  // water droplets trailing
  if(p<0.5&&Math.random()<0.6)addSplash(x,y+10,3,'#dff2ec',0.7);
}
function drawCatchAura(x,y,width,p,rare,isNew){
 if(!rare&&!isNew)return;
 const alpha=Math.sin(Math.PI*Math.min(1,p))*.65;
 ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha;
 const colors=rare?['#ffe8a2','#e8bb60','#fff3c9']:['#efb1b7','#b0dfd0','#a9d7f4','#f4df9a'];
 for(let i=0;i<3;i++){ctx.beginPath();ctx.strokeStyle=colors[i];ctx.lineWidth=3;const r=width*(.5+i*.16)+p*20;ctx.ellipse(0,0,r,r*.65,0,0,Math.PI*2);ctx.stroke();}
 if(!REDUCED_MOTION){for(let i=0;i<12;i++){const angle=i*Math.PI/6+p*.25;ctx.strokeStyle=colors[i%colors.length];ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(Math.cos(angle)*width*.65,Math.sin(angle)*width*.48);ctx.lineTo(Math.cos(angle)*width*.83,Math.sin(angle)*width*.64);ctx.stroke();}}
 ctx.restore();
}
function catchConfetti(isNew,rare){
 if(REDUCED_MOTION||(!isNew&&!rare))return '';
 const colors=rare?['#edbf55','#fff0b8','#ffffff']:['#ed9aa9','#a1d9c6','#92c9eb','#f4db91'];
 return '<div class="confetti-layer" aria-hidden="true">'+Array.from({length:24},(_,i)=>'<i style="--x:'+((i*37)%100)+'%;--delay:'+((i%6)*.08)+'s;--turn:'+((i%2?-1:1)*(180+i*15))+'deg;--piece:'+colors[i%colors.length]+'"></i>').join('')+'</div>';
}
function drawParticles(){ctx.save();G.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,(p.r||1.8)*(0.5+p.life*0.7),0,6.28);ctx.fill();});
  ctx.globalAlpha=1;ctx.restore();}
function drawSparkles(){G.sparkles.forEach(s=>{const a=Math.max(0,s.life);
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#ffe9a8';ctx.translate(s.x,s.y);ctx.rotate(s.d+G.t*2);
  const r=s.sz*(0.6+a);ctx.beginPath();
  for(let i=0;i<4;i++){ctx.lineTo(0,-r);ctx.lineTo(r*0.28,0);ctx.rotate(1.5708);}
  ctx.closePath();ctx.fill();ctx.restore();});}
function drawRod(){const shakeX=G.rodShake*(Math.random()-0.5)*7,shakeY=G.rodShake*(Math.random()-0.5)*4;
  const baseX=W*1.02,baseY=H*1.02,tipX=W*0.80+shakeX,tipY=H*0.30+shakeY;
  ctx.save();const bend=G.state==='fight'?22+Math.sin(G.t*3)*6:(G.state==='leap'?14:8);
  const cx=W*0.95,cy=H*0.62-bend;
  const grad=ctx.createLinearGradient(baseX,baseY,tipX,tipY);
  grad.addColorStop(0,'#4a3620');grad.addColorStop(0.6,'#6b4d2c');grad.addColorStop(1,'#caa46a');
  ctx.strokeStyle=grad;ctx.lineCap='round';ctx.lineWidth=13;
  ctx.beginPath();ctx.moveTo(baseX,baseY);ctx.quadraticCurveTo(cx,cy,tipX,tipY);ctx.stroke();
  ctx.lineWidth=5;ctx.strokeStyle='rgba(255,240,210,0.25)';
  ctx.beginPath();ctx.moveTo(baseX,baseY);ctx.quadraticCurveTo(cx,cy,tipX,tipY);ctx.stroke();
  ctx.fillStyle='#2c2018';ctx.beginPath();ctx.arc(W*0.965,H*0.86,10,0,6.28);ctx.fill();ctx.restore();}

function showCatch(s,size,pts,isNew){const ov=document.getElementById('catchOv');
  const img=SPR_SRC[s.id]||'',rare=s.rarity>=2||s.zone==='giant';
  ov.innerHTML='<div class="card '+(rare?'rare-catch':isNew?'new-catch':'')+'"><div class="cvbox">'+catchConfetti(isNew,rare)+
    (img?'<img class="catch-art" src="'+img+'" alt="'+s.name+'">':'')+
    (isNew?'<div class="newbadge">はじめて！</div>':'')+
    (s.rarity>=1?'<div class="rare">'+RARITY_NAME[s.rarity]+'</div>':'')+
    '</div><div class="body"><div class="name">'+s.name+'</div>'+
    '<div class="sub">'+ZONES[s.zone].name+' ・ '+RARITY_NAME[s.rarity]+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="k">サイズ</div><div class="v">'+size+'<span style="font-size:11px">cm</span></div></div>'+
    '<div class="stat"><div class="k">スコア</div><div class="v">+'+pts+'</div></div>'+
    '<div class="stat"><div class="k">つれた数</div><div class="v">'+G.dex[s.id].count+'</div></div>'+
    '</div><div class="flavor">'+s.flavor+'</div>'+
    '<button class="btn" id="nextBtn">つづける</button></div></div>';
  ov.classList.add('show');
  document.getElementById('nextBtn').onclick=()=>{ov.classList.remove('show');G.state='idle';G.hooked=null;
    setMsg('水面をタップして、もう一度','— しずかに、待つのも釣り —');};}

document.getElementById('dexBtn').onclick=openDex;
function openDex(){const ov=document.getElementById('dexOv');
  let items=SPECIES.map(s=>{const d=G.dex[s.id],got=!!d,img=SPR_SRC[s.id]||'';
    return '<div class="dex '+(got?'':'locked')+'"><div class="chip">'+
      (got&&img?'<img src="'+img+'" alt="'+s.name+'" loading="lazy">':'<span class="q">?</span>')+'</div>'+
      '<div class="meta"><div class="n">'+(got?s.name:'？？？')+'</div>'+
      '<div class="c">'+ZONES[s.zone].name+' ・ '+RARITY_NAME[s.rarity]+'</div>'+
      '<div class="best">'+(got?'最大 '+d.best+'cm ・ '+d.count+'匹':'みはっけん')+'</div></div></div>';}).join('');
  const done=SPECIES.filter(s=>G.dex[s.id]).length;
  ov.innerHTML='<div class="sheet"><div class="head"><h2>さかな図鑑</h2><button class="x" id="dexX">&times;</button></div>'+
    '<div class="grid">'+items+'</div>'+
    '<div class="foot">'+done+' / '+SPECIES.length+' 種  ・  スコア '+G.score+'</div></div>';
  ov.classList.add('show');
  document.getElementById('dexX').onclick=()=>ov.classList.remove('show');}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOut(t){return 1-Math.pow(1-t,2.2);}

document.getElementById('startBtn').onclick=()=>{if(sprLoaded!==SPECIES.length){loadSprites();return;}const ov=document.getElementById('startOv');
  document.getElementById('startInner').classList.add('fade-out');
  setTimeout(()=>ov.classList.remove('show'),400);spawnAmbient();
  setMsg('水面をタップして、糸を投げよう','— しずかに、待つのも釣り —');};
spawnAmbient();requestAnimationFrame(loop);
</script>
</body>
